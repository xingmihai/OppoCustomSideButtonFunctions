name: Build Signed APK

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          if [ -z "$ANDROID_HOME" ]; then export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"; fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_HOME"
          CMDLINE="$ANDROID_HOME/cmdline-tools/latest/bin"
          if [ ! -x "$CMDLINE/sdkmanager" ]; then
            echo "安装 cmdline-tools ..."
            curl -sSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q -o /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          fi
          yes | "$CMDLINE/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$CMDLINE/sdkmanager" --install "platform-tools" "platforms;android-37" "build-tools;36.0.0" 2>&1 | tail -5 || true
          echo "SDK 就绪: $ANDROID_HOME"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 签名全部来自仓库 Secrets，仓库内不保存明文密码
      - name: Prepare signing config
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KS_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KS_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_STORE_PASSWORD" ] || [ -z "$KS_KEY_ALIAS" ] || [ -z "$KS_KEY_PASSWORD" ]; then
            echo "::error::缺少签名 Secrets，请在 Settings -> Secrets and variables -> Actions 配置 SIGNING_KEYSTORE_BASE64 / SIGNING_STORE_PASSWORD / SIGNING_KEY_ALIAS / SIGNING_KEY_PASSWORD"
            exit 1
          fi
          mkdir -p keystore
          echo "$KS_B64" | base64 --decode > keystore/ci-signing.jks
          printf 'storeFile=keystore/ci-signing.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KS_STORE_PASSWORD" "$KS_KEY_ALIAS" "$KS_KEY_PASSWORD" > keystore/keystore.properties
          echo "签名配置已就位（来自 Secrets）"

      - name: Build Release APK
        id: build_release
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build-release.log
          exit ${PIPESTATUS[0]}

      - name: Build Debug APK
        id: build_debug
        continue-on-error: true
        run: |
          ./gradlew :app:assembleDebug --no-daemon 2>&1 | tee build-debug.log

      - name: Publish build logs to ci-logs branch
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-logs
          mkdir -p logs
          { echo "=== env ==="; java -version 2>&1; echo "--- sdk ---"; ls "$ANDROID_HOME"; ls "$ANDROID_HOME/platforms" 2>/dev/null; ls "$ANDROID_HOME/build-tools" 2>/dev/null; } > logs/env.txt 2>&1
          cp build-release.log logs/ 2>/dev/null || true
          cp build-debug.log logs/ 2>/dev/null || true
          git add -f logs
          if git diff --cached --quiet; then
            echo "日志无变化"
          else
            git commit -m "ci: build logs for run $GITHUB_RUN_ID"
            git push --force origin ci-logs
          fi

      - name: Collect APKs
        id: collect
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/' | tr -d ' ')
          [ -z "$VERSION" ] && VERSION="dev"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk   "out/CustomSideButtonFunctions-${VERSION}-release-signed.apk"
          cp app/build/outputs/apk/debug/app-debug.apk       "out/CustomSideButtonFunctions-${VERSION}-debug.apk"
          ls -lh out

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CustomSideButtonFunctions-${{ steps.collect.outputs.version }}
          path: out/*.apk
          if-no-files-found: error

      # 打 tag（v1.0.5 这种）推送时，自动发一个 Release 并附上 APK
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*release-signed.apk
          name: CustomSideButtonFunctions ${{ steps.collect.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 手动触发 / master 推送时，滚动更新 ci-latest 这个预发布版本，方便直接下载
      - name: Publish rolling release (ci-latest)
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-latest
          name: "最新构建 CustomSideButtonFunctions ${{ steps.collect.outputs.version }} (#${{ github.run_number }})"
          body: |
            自动构建产物，签名信息：
            - 别名：${{ secrets.SIGNING_KEY_ALIAS || '星觅海' }}
            - 来源 commit：${{ github.sha }}
          files: out/*.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # master 每次推送后，把最新 APK 同步到 apk 分支，方便直接下载
      - name: Push APK to apk branch
        if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B apk
          mkdir -p apk
          cp out/*.apk apk/
          git add -f apk
          if git diff --cached --quiet; then
            echo "APK 无变化，跳过提交"
          else
            git commit -m "chore: update built APK ${{ steps.collect.outputs.version }}"
            git push --force origin apk
          fi

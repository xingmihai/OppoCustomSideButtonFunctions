name: Preview Release

# 主分支：每次合入自动出一个滚动预发布，永远只保留最新一个
on:
  push:
    branches: [master]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/preview.yml"
      - ".github/scripts/**"
  workflow_dispatch:

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  preview:
    name: 构建并发布预览版
    if: |
      !startsWith(github.event.head_commit.message, 'chore: bump version') &&
      !startsWith(github.event.head_commit.message, 'chore(release)') &&
      !contains(github.event.head_commit.message, '[skip preview]')
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 解析版本信息
        id: vars
        run: echo "SHORT_SHA=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: 配置 JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: 恢复签名配置
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash .github/scripts/setup-signing.sh

      - name: 构建 Release APK
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log
          ./gradlew printVersionInfo --quiet | tee version.txt

      - name: 输出编译错误
        if: failure()
        run: |
          set +e
          grep -E "^e: |^w: .*error|error:|FAILED" build.log 2>/dev/null | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          grep -A6 "What went wrong" build.log 2>/dev/null | head -20 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: 整理并校验产物
        id: apk
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/^VERSION_NAME=//p' version.txt | head -1)
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          NEW="CustomSideButtonFunctions-preview-${VERSION_NAME}.apk"
          mv "$APK" "$NEW"
          bash .github/scripts/verify-apk.sh "$NEW"
          echo "file=$NEW" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=preview-${{ steps.vars.outputs.SHORT_SHA }}" >> "$GITHUB_OUTPUT"

      # 预览版只保留最新一个，避免 Release 列表被自动构建淹没
      - name: 删除上一个预览版
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OLD_TAG=$(git tag --list | grep -E '^preview-' | head -n 1 || true)
          if [ -n "$OLD_TAG" ]; then
            gh release delete "$OLD_TAG" --yes || echo "没有可删除的预览 Release"
            git push origin --delete "$OLD_TAG" || echo "没有可删除的预览标签"
          else
            echo "没有历史预览标签"
          fi

      - name: 生成更新日志
        id: changelog
        run: bash .github/scripts/generate-changelog.sh "${{ steps.apk.outputs.tag }}"

      - name: 发布预览版
        uses: softprops/action-gh-release@v2
        with:
          name: "侧键功能 Preview (${{ steps.vars.outputs.SHORT_SHA }})"
          tag_name: ${{ steps.apk.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: |
            ## 这是自动构建的最新测试版
            - **预发布版本，不建议日常主力机使用。**
            - 版本号 `${{ steps.apk.outputs.version_name }}`，对应提交 `${{ github.sha }}`。

            更新日志：
            ${{ steps.changelog.outputs.body }}
          prerelease: true
          files: ${{ steps.apk.outputs.file }}

      - name: 上传 mapping
        uses: actions/upload-artifact@v4
        with:
          name: mapping-preview
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 15
          if-no-files-found: warn

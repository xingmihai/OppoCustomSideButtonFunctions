name: 体积对比（临时）

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: A-minSdk37
            min: 37
            tgt: 37
          - name: B-minSdk26
            min: 26
            tgt: 35
    steps:
      - name: 检出 master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: 恢复签名配置
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash .github/scripts/setup-signing.sh

      # 对照组：只改 SDK 版本，其余代码完全一致
      - name: 设置 minSdk=${{ matrix.min }} targetSdk=${{ matrix.tgt }}
        run: |
          set -euo pipefail
          sed -i "s/minSdk = 37/minSdk = ${{ matrix.min }}/" app/build.gradle.kts
          sed -i "s/targetSdk = 37/targetSdk = ${{ matrix.tgt }}/" app/build.gradle.kts
          grep -n "minSdk\|targetSdk" app/build.gradle.kts

      - name: 构建并分解
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "===== RESULT ${{ matrix.name }} ====="
          echo "total_bytes=$(stat -c %s "$APK")"
          echo "-- 分类汇总 --"
          unzip -l "$APK" | awk '
            /classes.*\.dex/ {dex+=$1}
            /res\// {res+=$1}
            /resources\.arsc/ {arsc+=$1}
            /lib\// {lib+=$1}
            /META-INF/ {meta+=$1}
            END { printf "dex=%d res=%d arsc=%d lib=%d meta=%d\n", dex, res, arsc, lib, meta }'
          echo "-- 体积最大的 15 项 --"
          unzip -l "$APK" | sort -k1 -n -r | head -18
          echo "-- dex 文件 --"
          unzip -Z1 "$APK" 'classes*.dex'
          echo "-- mapping 行数 --"
          wc -l < app/build/outputs/mapping/release/mapping.txt

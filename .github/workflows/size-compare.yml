name: 体积对比（临时）

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: A-minSdk37
            min: 37
            tgt: 37
            legacy: "false"
          - name: B-minSdk26
            min: 26
            tgt: 35
            legacy: "false"
          - name: C-37-forcecompress
            min: 37
            tgt: 37
            legacy: "true"
    steps:
      - name: 检出 master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: 恢复签名配置
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash .github/scripts/setup-signing.sh

      - name: 设置对照变量
        run: |
          set -euo pipefail
          sed -i "s/minSdk = 37/minSdk = ${{ matrix.min }}/" app/build.gradle.kts
          sed -i "s/targetSdk = 37/targetSdk = ${{ matrix.tgt }}/" app/build.gradle.kts
          if [ "${{ matrix.legacy }}" = "true" ]; then
          python3 <<'PYEOF'
          p = "app/build.gradle.kts"
          s = open(p).read()
          old = '    packaging {\n        resources.excludes += "/META-INF/{AL2.0,LGPL2.1}"\n    }'
          new = '    packaging {\n        resources.excludes += "/META-INF/{AL2.0,LGPL2.1}"\n        dex { useLegacyPackaging = true }\n        jniLibs { useLegacyPackaging = true }\n    }'
          assert old in s, "packaging block not found"
          open(p, "w").write(s.replace(old, new))
          print("patched packaging")
          PYEOF
          fi
          grep -n "minSdk\|targetSdk\|useLegacyPackaging" app/build.gradle.kts

      - name: 构建并分解
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          emit() { echo "::notice::${{ matrix.name }} | $1"; }
          emit "total=$(stat -c %s "$APK")"
          unzip -v "$APK" | awk 'NR>3 && ($2=="Defl:N"||$2=="Stored") {m=($2=="Stored")?"Stored":"Defl"; tot[m]+=$1; raw[m]+=$3; n[m]++}
            END { printf "Defl: count=%d raw=%d packed=%d\n", n["Defl"], raw["Defl"], tot["Defl"];
                  printf "Stored: count=%d raw=%d packed=%d\n", n["Stored"], raw["Stored"], tot["Stored"] }' | while IFS= read -r l; do emit "$l"; done
          unzip -l "$APK" | awk '/classes.*\.dex/ {d+=$1} /resources\.arsc/ {a+=$1} END {printf "dex_raw=%d arsc_raw=%d\n", d, a}' | while IFS= read -r l; do emit "$l"; done

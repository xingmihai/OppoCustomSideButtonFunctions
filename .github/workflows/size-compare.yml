name: 体积对比（临时）

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: old-v1.0.12
            ref: v1.0.12
          - name: new-master
            ref: master
    steps:
      - name: 检出 ${{ matrix.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0

      - name: 配置 JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: 恢复签名配置
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash .github/scripts/setup-signing.sh

      - name: 构建并分解
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "===== RESULT ${{ matrix.name }} ====="
          echo "total_bytes=$(stat -c %s "$APK")"
          echo "-- 分类汇总 --"
          unzip -l "$APK" | awk '
            /classes.*\.dex/ {dex+=$1}
            /res\// {res+=$1}
            /resources\.arsc/ {arsc+=$1}
            /lib\// {lib+=$1}
            /META-INF/ {meta+=$1}
            END {
              printf "dex=%d res=%d arsc=%d lib=%d meta=%d\n", dex, res, arsc, lib, meta
            }'
          echo "-- 体积最大的 20 项 --"
          unzip -l "$APK" | sort -k1 -n -r | head -23
          echo "-- dex 数量 --"
          unzip -Z1 "$APK" 'classes*.dex' | wc -l
          echo "-- mapping 行数(反映保留的类/方法规模) --"
          wc -l < app/build/outputs/mapping/release/mapping.txt || true

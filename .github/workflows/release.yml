name: Stable Release

# 稳定版：手动触发后只生成草稿，确认更新日志再发布
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 版本号标签，例如 v1.0.12
        required: true
        type: string
      prerelease:
        description: 标记为预发布版本
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: stable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 构建签名 APK 并生成草稿
    runs-on: ubuntu-latest
    steps:
      # 版本号由 git 推导（提交数 + 最近的 v* 标签），必须拉取完整历史
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gradle/gradle-daemon-jvm.properties 要求 toolchainVersion=25
      - name: 配置 JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: 确定标签
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in v*) ;; *) TAG="v$TAG" ;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # 本地先打上标签（暂不推送），让 git describe 算出干净的 versionName；
      # 构建失败就不会留下空标签
      - name: 预置标签
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::标签 ${{ steps.version.outputs.tag }} 已存在"
            exit 1
          fi
          git tag "${{ steps.version.outputs.tag }}"

      - name: 恢复签名配置
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash .github/scripts/setup-signing.sh

      - name: 构建 Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace
          ./gradlew printVersionInfo --quiet | tee version.txt

      - name: 整理并校验产物
        id: apk
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/^VERSION_NAME=//p' version.txt | head -1)
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          NEW="CustomSideButtonFunctions-${VERSION_NAME}.apk"
          mv "$APK" "$NEW"
          bash .github/scripts/verify-apk.sh "$NEW"
          echo "file=$NEW" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: stable-apk-${{ steps.apk.outputs.version_name }}
          path: ${{ steps.apk.outputs.file }}
          retention-days: 15
          if-no-files-found: error

      - name: 推送标签
        if: github.event_name == 'workflow_dispatch'
        run: git push origin "${{ steps.version.outputs.tag }}"

      - name: 生成草稿 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: 侧键功能 ${{ steps.apk.outputs.version_name }}
          # 先落成草稿，确认更新日志后再手动发布
          draft: true
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.file }}

      - name: 上传 mapping
        uses: actions/upload-artifact@v4
        with:
          name: mapping-stable
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 15
          if-no-files-found: warn

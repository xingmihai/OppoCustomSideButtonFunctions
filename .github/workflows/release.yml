name: 发版 Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 版本号标签，例如 v1.1.0
        required: true
        type: string
      prerelease:
        description: 标记为预发布版本
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 构建签名 APK 并发布
    runs-on: ubuntu-latest
    steps:
      # 版本号由 git 推导（提交数 + 最近的 v* 标签），必须拉取完整历史，不能用浅克隆
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gradle/gradle-daemon-jvm.properties 要求 toolchainVersion=25
      - name: 配置 JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: 确定标签
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in v*) ;; *) TAG="v$TAG" ;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # 本地先打上标签（暂不推送），让 git describe 算出干净的 versionName；
      # 构建失败就不会留下空标签
      - name: 预置标签
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::标签 ${{ steps.version.outputs.tag }} 已存在"
            exit 1
          fi
          git tag "${{ steps.version.outputs.tag }}"

      - name: 恢复签名配置
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/custom-side-button.jks
          # Properties 以 ISO-8859-1 读取，中文别名需要写成 Unicode 转义
          ALIAS=$(python3 -c 'import os;print(os.environ["KEY_ALIAS"].encode("unicode_escape").decode())')
          {
            echo "storeFile=keystore/custom-side-button.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore/keystore.properties
          keytool -list -keystore keystore/custom-side-button.jks \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS"

      - name: 构建 Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace
          ./gradlew printVersionInfo --quiet | tee version.txt

      - name: 整理并校验产物
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/^VERSION_NAME=//p' version.txt | head -1)
          VERSION_CODE=$(sed -n 's/^VERSION_CODE=//p' version.txt | head -1)
          echo "versionName=$VERSION_NAME versionCode=$VERSION_CODE"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          mv "$APK" "CustomSideButtonFunctions-$VERSION_NAME.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | head -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "CustomSideButtonFunctions-$VERSION_NAME.apk" | head -6
          fi
          # 混淆后必须仍然存在的关键入口
          APK_FILE="CustomSideButtonFunctions-$VERSION_NAME.apk"
          unzip -l "$APK_FILE" | grep -q "META-INF/xposed/java_init.list" \
            || { echo "::error::Xposed 入口清单丢失"; exit 1; }
          for DEX in $(unzip -Z1 "$APK_FILE" 'classes*.dex'); do
            unzip -p "$APK_FILE" "$DEX" | strings | grep -q "ShizukuShellUserService" && FOUND_SHIZUKU=1
            unzip -p "$APK_FILE" "$DEX" | strings | grep -q "xposed/XposedEntry" && FOUND_ENTRY=1
          done
          [ -n "$FOUND_SHIZUKU" ] || { echo "::error::Shizuku UserService 被移除"; exit 1; }
          [ -n "$FOUND_ENTRY" ] || { echo "::error::XposedEntry 被移除"; exit 1; }
        id: apk

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: CustomSideButtonFunctions-${{ steps.apk.outputs.version_name }}
          path: CustomSideButtonFunctions-*.apk
          if-no-files-found: error

      - name: 推送标签
        if: github.event_name == 'workflow_dispatch'
        run: git push origin "${{ steps.version.outputs.tag }}"

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }} (${{ steps.apk.outputs.version_name }})
          files: CustomSideButtonFunctions-*.apk
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true

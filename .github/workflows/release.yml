name: 发版 Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 版本号标签，例如 v1.0.11
        required: true
        type: string
      prerelease:
        description: 标记为预发布版本
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 构建签名 APK 并发布
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # gradle/gradle-daemon-jvm.properties 要求 toolchainVersion=25
      - name: 配置 JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: 解析版本号
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in v*) ;; *) TAG="v$TAG" ;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: 恢复签名配置
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/custom-side-button.jks
          # Properties 以 ISO-8859-1 读取，中文别名需要写成 Unicode 转义
          ALIAS=$(python3 -c 'import os;print(os.environ["KEY_ALIAS"].encode("unicode_escape").decode())')
          {
            echo "storeFile=keystore/custom-side-button.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore/keystore.properties
          keytool -list -keystore keystore/custom-side-button.jks \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS"

      - name: 构建 Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: 整理并校验产物
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          mv "$APK" "CustomSideButtonFunctions-${{ steps.version.outputs.version }}.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | head -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "CustomSideButtonFunctions-${{ steps.version.outputs.version }}.apk" | head -6
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: CustomSideButtonFunctions-${{ steps.version.outputs.version }}
          path: CustomSideButtonFunctions-*.apk
          if-no-files-found: error

      # 手动触发时才创建标签；放在构建之后，构建失败不会留下空标签
      - name: 创建标签
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: v${{ steps.version.outputs.version }}
          files: CustomSideButtonFunctions-*.apk
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
